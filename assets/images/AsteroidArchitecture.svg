<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">Architecture réelle du moteur Asteroids</title><desc id="desc">Engine utilise TimerManager et LevelManager pour mettre à jour le Level actif. Level contient ActorManager, UCameraManager, CollisionManager et AudioManager. ActorManager gère AActor, composés de UComponent.</desc>
<rect width="1100" height="590" rx="20" fill="#09090b"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="420" y="28" width="260" height="70" rx="12" fill="#2b160d" stroke="#ff5500" stroke-width="2"/><text x="550" y="58" fill="#fff" font-size="23" font-weight="bold">Engine</text><text x="550" y="80" fill="#ffb28c" font-size="13">Update(deltaTime)</text>
<rect x="80" y="138" width="240" height="66" rx="10" fill="#18181b" stroke="#71717a"/><text x="200" y="167" fill="#fff" font-size="19">TimerManager</text><text x="200" y="187" fill="#a1a1aa" font-size="12">M_TIMER.Update()</text>
<rect x="430" y="138" width="240" height="66" rx="10" fill="#18181b" stroke="#71717a"/><text x="550" y="167" fill="#fff" font-size="19">LevelManager</text><text x="550" y="187" fill="#a1a1aa" font-size="12">M_LEVEL.GetCurrentLevel()</text>
<rect x="430" y="248" width="240" height="72" rx="10" fill="#2b160d" stroke="#ff5500" stroke-width="2"/><text x="550" y="277" fill="#fff" font-size="20">Level</text><text x="550" y="298" fill="#ffb28c" font-size="12">Update / Load / Unload</text>
<g fill="none" stroke="#ff5500" stroke-width="2"><path d="M485 98 L250 138"/><path d="M550 98 V138"/><path d="M550 204 V248"/></g>
<g fill="#18181b" stroke="#52525b"><rect x="30" y="365" width="240" height="65" rx="10"/><rect x="295" y="365" width="240" height="65" rx="10"/><rect x="560" y="365" width="240" height="65" rx="10"/><rect x="825" y="365" width="245" height="65" rx="10"/></g>
<g fill="#fff" font-size="18"><text x="150" y="403">ActorManager</text><text x="415" y="403">UCameraManager</text><text x="680" y="403">CollisionManager</text><text x="948" y="403">AudioManager</text></g>
<g stroke="#71717a" fill="none" stroke-width="2"><path d="M550 320 V342 H150 V365"/><path d="M550 342 H415 V365"/><path d="M550 342 H680 V365"/><path d="M550 342 H948 V365"/></g>
<rect x="70" y="475" width="230" height="70" rx="10" fill="#2b160d" stroke="#ff5500"/><text x="185" y="504" fill="#fff" font-size="19">AActor</text><text x="185" y="524" fill="#ffb28c" font-size="12">BeginPlay / Tick</text>
<rect x="370" y="475" width="320" height="70" rx="10" fill="#18181b" stroke="#71717a"/><text x="530" y="503" fill="#fff" font-size="19">UComponent</text><text x="530" y="525" fill="#a1a1aa" font-size="12">Collision / Movement / Shoot / Animation</text>
<path d="M150 430 V452 H185 V475 M300 510 H370" stroke="#ff5500" stroke-width="2" fill="none"/>
<text x="760" y="516" fill="#a1a1aa" font-size="13" text-anchor="start">Composition d'entités</text>
</g></svg>